[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ookla-ingest"
version = "0.1.0"
description = "Incremental public Ookla Parquet ingestion into GCS."
requires-python = ">=3.12"
dependencies = [
  "google-auth>=2.38,<3",
  "google-cloud-storage>=3,<4",
  "google-cloud-bigquery>=3.30,<4",
  "google-cloud-secret-manager>=2.23,<3",
  "pyarrow>=19,<27",
  "requests>=2.32,<3",
  "urllib3>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ingest = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
markers = ["integration: DEV-only tests requiring cloud access"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
